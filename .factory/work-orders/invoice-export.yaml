scope: |
  Add GET /v1/invoices/export — tenant-scoped CSV export of invoices.
  Must preserve GET /v1/invoices backward compatibility.
  Tenant identity from JWT only.
  Max 10,000 rows.
  CSV formula injection protection required.

constraints:
  backwardCompatibility: true
  tenantIsolation: required
  existingEndpointsMustNotBreak: true
  requiresProductApproval: false
  maxExportRows: 10000
  csvFormulaInjectionProtection: true
