apiVersion: factory.contract/v1
kind: WorkOrder

id: wo-billing-invoice-export-001
version: 1
title: "Add tenant-scoped invoice export endpoint"
targetService: factory-reference-billing-api
factoryRelease: "1.4.0"
requestedBy: "product-team"
createdAt: "2026-01-01T00:00:00Z"
