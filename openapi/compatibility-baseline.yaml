# BASELINE — documents the stable API surface for the invoice endpoint.
# The trusted verifier compares openapi/openapi.yaml at the base SHA against the PR head SHA.
# This file is not read by the verifier. See policies/billing-api.yaml in ai-factory-trusted-verifier.
# A PR that adds a required parameter to /v1/invoices WILL be rejected.

openapi: "3.0.3"
info:
  title: Billing API
  version: "1.0.0"

paths:
  /v1/invoices:
    get:
      summary: List invoices
      operationId: listInvoices
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [draft, issued, paid, overdue, cancelled]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
