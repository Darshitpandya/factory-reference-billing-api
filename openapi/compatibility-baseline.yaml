# BASELINE — this is the protected stable API surface.
# The trusted verifier uses this file at base SHA to detect breaking changes.
# A PR that adds a required parameter to /v1/invoices WILL be rejected.

openapi: "3.0.3"
info:
  title: Billing API
  version: "1.0.0"

paths:
  /v1/invoices:
    get:
      summary: List invoices
      operationId: listInvoices
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [draft, issued, paid, overdue, cancelled]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
